[[implementation]]
name = "original"
build = ["go", "build", "-C", "drivers/go", "-overlay", "overlay-original.json", "-o", "{build}/original", "."]
run = ["{build}/original"]

[[implementation]]
name = "reference"
build = ["ignite", "build", "drivers/ignite/driver.ignite", "--out", "{build}/reference"]
run = ["{build}/reference/bin/ledger-reference"]

[[implementation]]
name = "ignite"
build = ["ignite", "build", "drivers/ignite-out/driver.ignite", "--out", "{build}/ignite"]
run = ["{build}/ignite/bin/ledger-ignite"]

[[implementation]]
name = "roundtrip"
build = ["ignite", "build", "drivers/roundtrip/driver.ignite", "--out", "{build}/roundtrip"]
run = ["{build}/roundtrip/bin/ledger-roundtrip"]
