version: "3"

vars:
  IGNITE: '{{.IGNITE | default "ignite"}}'
  CODESPEC_DIR: '{{.CODESPEC_DIR | default "../codespec"}}'
  CODESPEC: '{{.CODESPEC | default (printf "%s/target/debug/codespec" .CODESPEC_DIR)}}'
  ADAPTERS: '{{.ADAPTERS | default (printf "%s/target/adapters" .CODESPEC_DIR)}}'

tasks:
  check:
    desc: Check every Ignite source file
    cmds:
      - for f in $(find src tools -name '*.ignite' 2>/dev/null); do {{.IGNITE}} check "$f" || exit 1; done
      - task: cir-model
      - task: harness
      - task: writer
      - task: reader

  reader:
    desc: The reader's inline tests pass, and reading the ledger reference through codespec gives a canonical document, the same bytes twice, equal to the checked-in one
    cmds:
      - task: test-reader
      - task: read-ledger
      - task: reader-values
      - task: reader-builds

  reader-builds:
    desc: Read examples/reader-builds/source/builds.ignite, pass and write it as Go, and run the Go against the Ignite original in the harness; the Go must build and the outputs must be byte-equal
    cmds:
      - task: reader-adapter
      - '{{.IGNITE}} test examples/reader-builds/source/builds.ignite --out target/reader-builds/test'
      - mkdir -p target/reader-builds/bin
      - ln -sf "$(realpath "$(command -v {{.IGNITE}})")" target/reader-builds/bin/ignite
      - PATH="$PWD/target/reader-builds/bin:$PATH" {{.CODESPEC}} read --lang ignite examples/reader-builds/source/builds.ignite --out target/reader-builds/builds.cir.json --adapters target/adapters
      - '{{.CODESPEC}} pass target/reader-builds/builds.cir.json --out target/reader-builds/builds.facts.json'
      - '{{.CODESPEC}} write --lang go target/reader-builds/builds.facts.json --out target/reader-builds/go --adapters {{.ADAPTERS}}'
      - PATH="$PWD/target/reader-builds/bin:$PATH" {{.CODESPEC}} harness examples/reader-builds --seeds 1 --commands 1 --build-dir target/reader-builds/harness

  reader-values:
    desc: Read examples/reader-values/source/values.ignite, pass and write it as Go, and run the Go against the Ignite original in the harness; the outputs must be byte-equal
    cmds:
      - task: reader-adapter
      - '{{.IGNITE}} test examples/reader-values/source/values.ignite --out target/reader-values/test'
      - mkdir -p target/reader-values/bin
      - ln -sf "$(realpath "$(command -v {{.IGNITE}})")" target/reader-values/bin/ignite
      - PATH="$PWD/target/reader-values/bin:$PATH" {{.CODESPEC}} read --lang ignite examples/reader-values/source/values.ignite --out target/reader-values/values.cir.json --adapters target/adapters
      - '{{.CODESPEC}} pass target/reader-values/values.cir.json --out target/reader-values/values.facts.json'
      - '{{.CODESPEC}} write --lang go target/reader-values/values.facts.json --out target/reader-values/go --adapters {{.ADAPTERS}}'
      - PATH="$PWD/target/reader-values/bin:$PATH" {{.CODESPEC}} harness examples/reader-values --seeds 1 --commands 1 --build-dir target/reader-values/harness

  reader-adapter:
    desc: Build codespec-read-ignite into target/adapters, the --adapters directory of codespec read --lang ignite
    run: once
    cmds:
      - '{{.IGNITE}} build src/read.ignite --out target/ignite/read'
      - mkdir -p target/adapters
      - cp target/ignite/read/bin/codespec-read-ignite target/adapters/codespec-read-ignite

  test-reader:
    desc: Run the inline tests of the reader
    cmds:
      - '{{.IGNITE}} test src/read.ignite --out target/ignite-test-reader'

  read-ledger:
    desc: Read examples/ledger/reference.ignite twice with the IGNITE compiler as `ignite`; the document validates as canonical, both reads are byte-equal and equal examples/ledger/reference.cir.json
    cmds:
      - task: reader-adapter
      - mkdir -p target/read/bin
      - ln -sf "$(realpath "$(command -v {{.IGNITE}})")" target/read/bin/ignite
      - PATH="$PWD/target/read/bin:$PATH" {{.CODESPEC}} read --lang ignite examples/ledger/reference.ignite --out target/read/ledger.cir.json --adapters target/adapters
      - PATH="$PWD/target/read/bin:$PATH" {{.CODESPEC}} read --lang ignite examples/ledger/reference.ignite --out target/read/ledger.again.cir.json --adapters target/adapters
      - '{{.CODESPEC}} validate --canonical target/read/ledger.cir.json'
      - cmp target/read/ledger.cir.json target/read/ledger.again.cir.json
      - cmp target/read/ledger.cir.json examples/ledger/reference.cir.json

  writer:
    desc: The writer's inline tests pass, its output of the ledger and orders examples equals the checked-in output and checks silently
    cmds:
      - task: test-writer
      - task: write-ledger
      - task: write-orders

  adapters:
    desc: Build codespec-write-ignite into target/adapters, the --adapters directory of codespec write --lang ignite
    run: once
    cmds:
      - '{{.IGNITE}} build src/write.ignite --out target/ignite/write'
      - mkdir -p target/adapters
      - cp target/ignite/write/bin/codespec-write-ignite target/adapters/codespec-write-ignite

  test-writer:
    desc: Run the inline tests of the writer
    cmds:
      - '{{.IGNITE}} test src/write.ignite --out target/ignite-test-writer'

  write-ledger:
    desc: Read, pass and write the ledger; the output equals examples/ledger/out/ignite and checks without a diagnostic
    cmds:
      - task: adapters
      - mkdir -p target/write
      - '{{.CODESPEC}} read --lang go examples/ledger/source --out target/write/ledger.cir.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} pass target/write/ledger.cir.json --out target/write/ledger.facts.json'
      - '{{.CODESPEC}} write --lang ignite target/write/ledger.facts.json --out target/write/ledger --adapters target/adapters'
      - cmp target/write/ledger/ledger.ignite examples/ledger/out/ignite/ledger.ignite
      - cmp target/write/ledger/refusals.json examples/ledger/out/ignite/refusals.json
      - test -z "$({{.IGNITE}} check examples/ledger/out/ignite/ledger.ignite 2>&1)"
      - test -z "$({{.IGNITE}} check examples/ledger/drivers/ignite-out/driver.ignite 2>&1)"

  write-orders:
    desc: Read, pass and write codespec's orders example; its refusals equal examples/orders-refusals.expected.json and the written rest checks without a diagnostic
    cmds:
      - task: adapters
      - mkdir -p target/write
      - '{{.CODESPEC}} read --lang go {{.CODESPEC_DIR}}/examples/orders/source --out target/write/orders.cir.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} pass target/write/orders.cir.json --out target/write/orders.facts.json'
      - '{{.CODESPEC}} write --lang ignite target/write/orders.facts.json --out target/write/orders --adapters target/adapters'
      - cmp target/write/orders/refusals.json examples/orders-refusals.expected.json
      - test -z "$({{.IGNITE}} check target/write/orders/orders.ignite 2>&1)"

  cir-model:
    desc: The cir/1 model is current, every example document round trips, the inline tests pass
    cmds:
      - task: model-check
      - task: roundtrip-check
      - task: test-cir

  build-gen-model:
    internal: true
    cmds:
      - '{{.IGNITE}} build tools/gen_model.ignite --out target/ignite/gen_model'

  model:
    desc: Regenerate src/cir.ignite from schemas/cir-1.schema.json of CODESPEC_DIR
    cmds:
      - task: build-gen-model
      - target/ignite/gen_model/bin/gen-model --codespec {{.CODESPEC_DIR}}

  model-check:
    desc: Fail when src/cir.ignite differs by one byte from what the schema of CODESPEC_DIR generates
    cmds:
      - task: build-gen-model
      - mkdir -p target/model
      - target/ignite/gen_model/bin/gen-model --codespec {{.CODESPEC_DIR}} --out target/model/cir.ignite
      - cmp src/cir.ignite target/model/cir.ignite

  roundtrip-check:
    desc: Read and re-encode every examples/*/*.cir.json of CODESPEC_DIR and of this repository, byte-equal
    cmds:
      - '{{.IGNITE}} build src/cir_json.ignite --out target/ignite/cir_roundtrip'
      - target/ignite/cir_roundtrip/bin/cir-roundtrip --root {{.CODESPEC_DIR}}
      - if ls examples/*/*.cir.json >/dev/null 2>&1; then target/ignite/cir_roundtrip/bin/cir-roundtrip --root .; else echo "no examples/*/*.cir.json in this repository"; fi

  test-cir:
    desc: Run the inline tests of the model reader and writer and of the generator
    cmds:
      - '{{.IGNITE}} test src/cir_json.ignite tools/gen_model.ignite --out target/ignite-test'

  ledger-cir:
    desc: Read the ledger's Go source into cir/1, require no refusals, canonical bytes and the checked-in document
    cmds:
      - mkdir -p target/ledger-cir
      - '{{.CODESPEC}} read --lang go examples/ledger/source --out target/ledger-cir/ledger.cir.json --adapters {{.ADAPTERS}}'
      - '{{.CODESPEC}} validate --canonical target/ledger-cir/ledger.cir.json'
      - '! grep -q ''"refusals"'' target/ledger-cir/ledger.cir.json'
      - cmp target/ledger-cir/ledger.cir.json examples/ledger/ledger.cir.json

  harness:
    desc: Run the ledger's Go original and Ignite reference on 200 seeded traces of 300 commands and require byte-equal output
    cmds:
      - test -z "$(gofmt -l examples/ledger)"
      - '{{.IGNITE}} check examples/ledger/reference.ignite'
      - '{{.IGNITE}} check examples/ledger/drivers/ignite/driver.ignite'
      - '{{.IGNITE}} test examples/ledger/reference.ignite --out target/ledger-test'
      - task: ledger-cir
      - PATH="$(dirname "$(command -v {{.IGNITE}})"):$PATH" {{.CODESPEC}} harness examples/ledger --seeds 200 --commands 300 --build-dir target/harness
